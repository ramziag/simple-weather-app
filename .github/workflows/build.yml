name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub release (handy for downloading on the phone)
        type: boolean
        default: true
      screenshots:
        description: Commit fresh screenshots to docs/screenshots
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Use private signing key (only if the secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          LIVE_API: "1"
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "weather-1.0.$BUILD_NUMBER.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: weather-1.0.${{ github.run_number }}
          path: weather-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Weather 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: weather-1.0.${{ github.run_number }}.apk

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || { git commit -m "Update screenshots" && git push; }
